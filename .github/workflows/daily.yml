# Daily production run: schedule the next batch when the current one is running out, LLM-score
# upcoming games within the free Gemini quota, then upload answer keys (and embeddings-only
# fallbacks for unfinished games due soon) to KV.
# See docs/OPERATIONS.md. The repo is private (2,000 free Actions minutes/month), so the job
# stays lean: no torch (embedding caches come prebuilt from a release) and a hard timeout.
name: Daily puzzles

on:
  schedule:
    # Just after the Gemini free quota resets at midnight Pacific (07:00 UTC in summer, 08:00 in winter).
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      max_requests:
        description: "LLM request cap for this run (0 = only build and upload keys)"
        default: "40"

# Never two runs at once: they would share the quota and race on the KV state.
concurrency:
  group: daily-puzzles
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Bump when data/vocab.json or the embeddings change (new release with a fresh emb.zip).
  EMBEDDINGS_TAG: embeddings-v1

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Setup isn't finished (a secret or the embeddings release is missing): explain it on the
      # run page and stop cleanly instead of failing with a cryptic error. Puzzles already in KV
      # keep being served either way.
      - name: Check setup
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=()
          [ "$HAS_GEMINI" = "true" ] || missing+=("secret GEMINI_API_KEY")
          [ "$HAS_TOKEN" = "true" ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAS_ACCOUNT" = "true" ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          gh release view "$EMBEDDINGS_TAG" > /dev/null 2>&1 || missing+=("release $EMBEDDINGS_TAG with emb.zip")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: setup isn't finished"
              echo "Still needed (see docs/OPERATIONS.md, One-time setup):"
              for m in "${missing[@]}"; do echo "- $m"; done
              echo
              echo "Nothing is broken: puzzles already uploaded keep working."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipped: still needed: ${missing[*]}"
          fi

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Python packages
        if: steps.setup.outputs.ready == 'true'
        run: pip install --quiet numpy wordfreq lemminflect requests

      - name: Embedding caches
        if: steps.setup.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$EMBEDDINGS_TAG" --pattern emb.zip --dir "$RUNNER_TEMP"
          mkdir -p data/emb
          unzip -o -j -q "$RUNNER_TEMP/emb.zip" -d data/emb
          ls -l data/emb

      # Intermediate LLM files (brainstorms, chunk scores) so a word started yesterday resumes.
      # Finished keys live in KV, so losing this cache only costs a few requests. The folder names
      # are the answers, so the cache holds only an encrypted archive: pull requests from forks can
      # read a public repo's caches but never get the secret that unlocks it.
      - name: Restore LLM work
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: llm-prod.enc
          key: llm-prod-enc-${{ github.run_id }}
          restore-keys: llm-prod-enc-

      - name: Unlock LLM work
        if: steps.setup.outputs.ready == 'true'
        env:
          CACHE_PASS: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p data/llm/prod
          if [ -f llm-prod.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_PASS -in llm-prod.enc | tar -xz -C data/llm \
              || echo "Couldn't open the saved work (the token may have changed); starting fresh."
          fi

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Wrangler
        if: steps.setup.outputs.ready == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Schedules the next 91-day batch on its own once fewer than 35 days are left, so nobody has
      # to remember to. Prints counts only, never words.
      - name: Next batch if needed
        if: steps.setup.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/schedule.py --remote-state --if-fewer-than 35

      - name: Produce and upload
        if: steps.setup.outputs.ready == 'true'
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: >-
          python pipeline/produce.py --remote-state --upload
          --max-requests "${{ inputs.max_requests || '40' }}" --max-minutes 40

      # Saved even when the run fails or times out, so finished requests are never repeated.
      - name: Lock LLM work
        if: always() && steps.setup.outputs.ready == 'true'
        env:
          CACHE_PASS: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tar -czf - -C data/llm prod | openssl enc -aes-256-cbc -pbkdf2 -pass env:CACHE_PASS -out llm-prod.enc

      - name: Save LLM work
        if: always() && steps.setup.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: llm-prod.enc
          key: llm-prod-enc-${{ github.run_id }}
