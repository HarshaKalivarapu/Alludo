# Deploy the site to Cloudflare Pages (project "alludo") whenever web/ changes on main.
# functions/ (the /api routes) is picked up automatically from web/.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Wrangler
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name alludo
